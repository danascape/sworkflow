#############################################
# Name:        arm64-gnu-llvm base profile
# Description: arm64 target built with the GNU
#              toolchain prefixes and full LLVM
#############################################

schema = 1

[kernel]
arch = "arm64"

[toolchain]
cross_compile = "aarch64-linux-gnu-"
cross_compile_arm32 = "arm-linux-gnueabi-"
clang = true
env = { LLVM = "1", LLVM_IAS = "1" }
